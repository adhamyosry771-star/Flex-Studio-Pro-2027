    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip-utils/0.1.0/jszip-utils.min.js"></script>
    <script>
      // Fallback polyfill for JSZipUtils in case of CDN failure
      if (typeof window !== 'undefined' && !window.JSZipUtils) {
        window.JSZipUtils = {
          getBinaryContent: function(path, callback) {
            fetch(path)
              .then(function(res) {
                if (!res.ok) throw new Error('Failed to fetch binary ' + res.status);
                return res.arrayBuffer();
              })
              .then(function(buf) {
                callback(null, buf);
              })
              .catch(function(err) {
                callback(err);
              });
          }
        };
      }
    </script>

      #svga-player-container {

      }

      #svga-player-container canvas {

        object-fit: contain !important;

      }
    </style>
